<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نمونه‌کارهای مائده | تصویرسازی و طراحی وکتور</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f3eb;color:#27372f;font-family:Tahoma,Arial,sans-serif}
header{padding:42px 7% 30px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #ded8cc}
.brand{display:flex;align-items:center;gap:15px}
.logo{width:48px;height:48px;border-radius:50%;background:#3f654f;display:grid;place-items:center;color:white;font-size:25px}
h1{margin:0;font-size:28px}
.subtitle{margin:7px 0 0;color:#6b746e;font-size:15px}
nav{display:flex;gap:22px;color:#56625b;font-size:14px}
main{width:min(1120px,88%);margin:50px auto 70px}
.intro{max-width:720px;margin-bottom:34px}
.intro h2{font-size:30px;margin:0 0 10px}
.intro p{color:#69736d;line-height:2;margin:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}
.card{background:white;border:1px solid #e5dfd4;border-radius:16px;overflow:hidden;box-shadow:0 5px 20px rgba(45,55,48,.06)}
.card img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.caption{padding:16px 18px;font-size:16px}
footer{text-align:center;border-top:1px solid #ded8cc;padding:25px;color:#7a827d;font-size:13px}
@media(max-width:700px){header{display:block}nav{margin-top:20px}.grid{grid-template-columns:1fr}main{width:92%}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">م</div>
    <div>
      <h1>مائده</h1>
      <div class="subtitle">تصویرسازی و طراحی وکتور</div>
    </div>
  </div>
  <nav><span>خانه</span><span>نمونه‌کارها</span><span>درباره من</span><span>تماس</span></nav>
</header>
<main>
  <section class="intro">
    <h2>نمونه‌کارها</h2>
    <p>مجموعه‌ای از تصویرسازی‌های دیجیتال با تمرکز بر طبیعت، معماری و سبک وکتوری.</p>
  </section>
  <section class="grid">
    
        <article class="card">
          <img src="work_1.jpg" alt="طبیعت و منظره">
          <div class="caption">طبیعت و منظره</div>
        </article>
        
        <article class="card">
          <img src="work_2.jpg" alt="تصویرسازی معماری">
          <div class="caption">تصویرسازی معماری</div>
        </article>
            <article class="card">
          <img src="work_3.jpg" alt="تصویرسازی معماری">
          <div class="caption">تصویرسازی معماری</div>
            </article>
    <article class="card">
  <img src="work_4.jpg" alt="تصویرسازی باغ ایرانی">
  <div class="caption">تصویرسازی باغ ایرانی</div>
    </article>
        
  </section>
</main>
<footer>برای مشاهده نمونه‌های بیشتر، در صورت نیاز با من در تماس باشید.</footer>
</body>
</html>
